[tool.poetry]
name = "emotion-recognition"
version = "0.1.0"
description = "Распознавание эмоций по аудиофайлам"
authors = ["Степан Карпов <stepan@example.com>"]
readme = "README.md"
packages = [{include = "emotion_recognition"}]

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.0.0"
pytorch-lightning = "^2.0.0"
librosa = "^0.10.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
scikit-learn = "^1.3.0"
mlflow = "^2.8.0"
hydra-core = "^1.3.0"
omegaconf = "^2.3.0"
fire = "^0.5.0"
dvc = "^3.0.0"
onnx = "^1.14.0"
onnxruntime = "^1.16.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
gitpython = "^3.1.0"
soundfile = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
